name: Wyzant poll

on:
  schedule:
    # 07:00 through 23:00 Eastern while EDT is in effect. UTC does not follow
    # daylight saving, so this window drifts one hour earlier in winter. Jobs
    # sit on the board for 5 to 12 hours, so 30 minutes is still much faster
    # than the source changes.
    - cron: "0,30 0-3,11-23 * * *"
  workflow_dispatch:

concurrency:
  group: wyzant-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.1
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply schedule jitter
        run: sleep $((RANDOM % 121))
      - name: Poll and ingest
        run: pnpm wyzant:poll
        env:
          WYZANT_STORAGE_STATE_JSON: ${{ secrets.WYZANT_STORAGE_STATE_JSON }}
          WYZANT_FEED_URL: ${{ vars.WYZANT_FEED_URL }}
          WYZANT_MESSAGES_URL: ${{ vars.WYZANT_MESSAGES_URL }}
          WYZANT_TARGET_SUBJECTS: College Counseling|English|Essay Writing|SAT Reading
          WYZANT_TARGET_LOCATIONS: Manhattan|New York, NY
          WYZANT_INCLUDE_ONLINE_JOBS: "true"
          WYZANT_TUTOR_ID: tutor-admissions
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
